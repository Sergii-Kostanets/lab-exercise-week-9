<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Student name: Sergii Kostanets -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid practice</title>
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
      integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX"
      crossorigin="anonymous">
    <style>
      .demo-tile {
        background-color: #cfe6d0;
      }
    </style>
  </head>
  <body>
    <header class="container py-3">
      <h1>Grid practice</h1>
    </header>
    <main class="container">
      <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3">
        <div class="col">
          <div class="demo-tile p-3">Ferns</div>
        </div>
        <div class="col">
          <div class="demo-tile p-3">Cacti</div>
        </div>
        <div class="col">
          <div class="demo-tile p-3">Herbs</div>
        </div>
        <div class="col">
          <div class="demo-tile p-3">Orchids</div>
        </div>
        <div class="col">
          <div class="demo-tile p-3">Succulents</div>
        </div>
        <div class="col">
          <div class="demo-tile p-3">Bonsai</div>
        </div>
      </div>
      <div class="row mt-4">
        <div class="col-md-8 offset-md-2">
          <div class="demo-tile p-3">Collection notice</div>
        </div>
      </div>
      <div class="row mt-4 justify-content-center align-items-center">
        <div class="col-md-5">
          <div class="demo-tile p-3">Collect from the shop.</div>
        </div>
        <div class="col-md-5">
          <div class="demo-tile p-3">Collect from the shop, Wednesday to Sunday, between nine and five. Bring your order number.</div>
        </div>
      </div>
    </main>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
      crossorigin="anonymous"></script>
  </body>
</html>
