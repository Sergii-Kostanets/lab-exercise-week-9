<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Student name: Sergii Kostanets -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products | Seaview Plants</title>
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
      integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX"
      crossorigin="anonymous">
  </head>
  <body>
    <header class="container py-3">
      <h1>Seaview Plants</h1>
      <p>Plants and pots for collection</p>
    </header>
    <main class="container">
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3">
            <div class="col">
                <article>
                    <img src="images/ferns.svg" class="img-fluid"
                    alt="Soft green fronds"
                    width="600" height="360">
                    <h2>Ferns</h2>
                </article>
            </div>
            <div class="col">
                <article>
                    <img src="images/cacti.svg" class="img-fluid"
                    alt="Soft green fronds"
                    width="600" height="360">
                    <h2>Cacti</h2>
                </article>
            </div>
            <div class="col">
                <article>
                    <img src="images/herbs.svg" class="img-fluid"
                    alt="Soft green fronds"
                    width="600" height="360">
                    <h2>Herbs</h2>
                </article>
            </div>
            <div class="col">
                <article>
                    <img src="images/orchids.svg" class="img-fluid"
                    alt="Soft green fronds"
                    width="600" height="360">
                    <h2>Orchids</h2>
                </article>
            </div>
            <div class="col">
                <article>
                    <img src="images/succulents.svg" class="img-fluid"
                    alt="Soft green fronds"
                    width="600" height="360">
                    <h2>Succulents</h2>
                </article>
            </div>
            <div class="col">
                <article>
                    <img src="images/bonsai.svg" class="img-fluid"
                    alt="Soft green fronds"
                    width="600" height="360">
                    <h2>Bonsai</h2>
                </article>
            </div>
        </div>
    </main>
    <footer class="container py-3">
      <p>Collect from the shop, Wednesday to Sunday.</p>
    </footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
      crossorigin="anonymous"></script>
  </body>
</html>
