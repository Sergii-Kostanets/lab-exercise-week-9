<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Student name: Sergii Kostanets -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seaview Plants</title>
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
      integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX"
      crossorigin="anonymous">
  </head>
  <body>
    <div class="container">
      <header>
        <h1 class="display-4 text-center">Seaview Plants</h1>
        <p class="lead">Healthy plants and small pots, ready to take home.</p>
      </header>
      <main class="mt-3 p-4">
        <h2 class="fw-bold">On the shelf</h2>
        <ul>
          <li>Ferns</li>
          <li>Cacti</li>
          <li>Herbs</li>
        </ul>
        <img src="images/shelf.svg"
            alt="Three plant pots on a wooden shelf"
            width="480" height="160" class="img-fluid d-block mx-auto">
        <a class="btn btn-primary mt-3" href="#visit">Visiting the shop</a>
      </main>
      <footer id="visit" class="px-4">
        <p class="m-0">Open Wednesday to Sunday, nine until five.</p>
      </footer>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
      crossorigin="anonymous"></script>
  </body>
</html>
